# CI: macOS / Ubuntu / Windows × Deno / Bun / Node — unit + integration + e2e
# Bun e2e 需 Playwright Chromium；Bun ≥1.4（CI bun-version: latest）。
# unit / integration / e2e 分步跑，避免 integration 结束 cleanupSuiteBrowser 拖垮 e2e。
# 例外：Windows＋Bun 临时关闭 e2e（上游浏览器限制）；unit＋integration 仍跑。
name: CI

# Pin Linux to ubuntu-24.04: ubuntu-latest is 26.04; Playwright rejects
# chromium (+ --with-deps) there. Match @dreamer/test / view CI pin.

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

# 工作流级 env：让基于 Node 的 GitHub Actions（如 checkout、setup-*）提前使用 Node 24 运行时，
# 便于在官方强制升级前做性能/稳定性验证。参见 GitHub 文档中的 FORCE_JAVASCRIPT_ACTIONS_TO_NODE24。
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install image dependencies (Linux)
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9

      - name: Cache dependencies
        run: deno cache src/cli.ts src/setup.ts 2>/dev/null || true

      - name: Install Playwright Chromium
        run: npx -y playwright@1.59.1 install --with-deps chromium

      - name: Check
        run: deno check src/ tests/

      - name: Lint
        run: deno lint

      - name: Test (Deno)
        run: deno test -A --no-check tests/

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install image dependencies (macOS)
        run: brew install imagemagick

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9

      - name: Cache dependencies
        run: deno cache src/cli.ts src/setup.ts 2>/dev/null || true

      - name: Install Playwright Chromium
        run: npx -y playwright@1.59.1 install chromium

      - name: Check
        run: deno check src/ tests/

      - name: Lint
        run: deno lint

      - name: Test (Deno, macOS)
        run: deno test -A --no-check tests/

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install image dependencies (Windows)
        run: choco install imagemagick -y
        shell: pwsh

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9

      - name: Setup Chrome (for browser E2E tests)
        uses: browser-actions/setup-chrome@v1

      - name: Cache dependencies
        run: deno cache src/cli.ts src/setup.ts

      - name: Install Playwright Chromium
        run: npx -y playwright@1.59.1 install chromium

      - name: Check
        run: deno check src/ tests/

      - name: Lint
        run: deno lint

      - name: Test (Deno, Windows)
        run: deno test -A --no-check tests/

  test-linux-bun:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install image dependencies (Linux)
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (Bun)
        run: bun install

      # Use bunx (not npx): after bun install, npx fails with "playwright: not found" on all OS.
      - name: Install Playwright Chromium
        run: bunx playwright@1.59.1 install --with-deps chromium

      # unit、integration、e2e 分开跑，避免 integration 结束时触发 cleanupSuiteBrowser 导致 "browser close timeout"
      - name: Test (Bun) unit
        run: bun test --max-concurrency=1 tests/unit
      - name: Test (Bun) integration
        run: bun test --max-concurrency=1 tests/integration
      # e2e 按文件串行，减少 afterAll 超时 / dangling / browser close 互相干扰
      - name: Test (Bun) e2e
        run: |
          failed=0
          for f in tests/e2e/*.test.ts; do
            bun test --max-concurrency=1 "$f" || failed=1
          done
          exit $failed

  test-macos-bun:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install image dependencies (macOS)
        run: brew install imagemagick

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (Bun)
        run: bun install

      - name: Install Playwright Chromium
        run: bunx playwright@1.59.1 install chromium

      # unit、integration、e2e 分开跑，避免 integration 结束时触发 cleanupSuiteBrowser 导致 "browser close timeout"
      - name: Test (Bun, macOS) unit
        run: bun test --max-concurrency=1 tests/unit
      - name: Test (Bun, macOS) integration
        run: bun test --max-concurrency=1 tests/integration
      - name: Test (Bun, macOS) e2e
        run: |
          failed=0
          for f in tests/e2e/*.test.ts; do
            bun test --max-concurrency=1 "$f" || failed=1
          done
          exit $failed

  test-windows-bun:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (Bun)
        run: bun install

      # Windows＋Bun 浏览器／e2e：上游兼容限制，CI 临时关闭本步（unit＋integration 仍跑；
      # integration 中子进程用例见 SKIP_WINDOWS_BUN_CHILD_PROCESS）。勿关 Linux／macOS Bun e2e。
      - name: Test (Bun, Windows) unit
        run: bun test --max-concurrency=1 tests/unit
      - name: Test (Bun, Windows) integration
        run: bun test --max-concurrency=1 tests/integration

  # ─── Node.js jobs（unit + integration + e2e 全量）───
  test-linux-node:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install image dependencies (Linux)
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies (Node)
        run: npm install

      - name: Install Playwright Chromium
        run: npx -y playwright@1.59.1 install --with-deps chromium

      - name: Test (Node, Linux) unit
        run: npm run test:node

      - name: Test (Node, Linux) integration
        run: npm run test:node:integration

      - name: Test (Node, Linux) e2e
        run: npm run test:node:e2e

  test-macos-node:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install image dependencies (macOS)
        run: brew install imagemagick

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies (Node)
        run: npm install

      - name: Install Playwright Chromium
        run: npx -y playwright@1.59.1 install chromium

      - name: Test (Node, macOS) unit
        run: npm run test:node

      - name: Test (Node, macOS) integration
        run: npm run test:node:integration

      - name: Test (Node, macOS) e2e
        run: npm run test:node:e2e

  test-windows-node:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies (Node)
        run: npm install

      - name: Setup Chrome (for browser E2E tests)
        uses: browser-actions/setup-chrome@v1

      - name: Install Playwright Chromium
        run: npx -y playwright@1.59.1 install chromium

      - name: Test (Node, Windows) unit
        run: npm run test:node

      - name: Test (Node, Windows) integration
        run: npm run test:node:integration

      - name: Test (Node, Windows) e2e
        run: npm run test:node:e2e
