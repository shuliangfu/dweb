# CI: 在 macOS、Ubuntu、Windows 上运行测试，验证跨平台兼容性
# 结构参考 view 包：Deno 与 Bun 拆成独立 job；Windows 上 Bun 不跑浏览器 e2e
# 暂不跑 Bun 浏览器 e2e（unit/integration 保留）；恢复时取消 test-*-bun 中 e2e 与 Playwright 注释
name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

# 工作流级 env：让基于 Node 的 GitHub Actions（如 checkout、setup-*）提前使用 Node 24 运行时，
# 便于在官方强制升级前做性能/稳定性验证。参见 GitHub 文档中的 FORCE_JAVASCRIPT_ACTIONS_TO_NODE24。
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install image dependencies (Linux)
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5

      - name: Cache dependencies
        run: deno cache src/cli.ts src/setup.ts 2>/dev/null || true

      - name: Install Playwright Chromium
        run: npx -y playwright@latest install chromium

      - name: Check
        run: deno check src/ tests/

      - name: Lint
        run: deno lint

      - name: Test (Deno)
        run: deno test -A --no-check tests/

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install image dependencies (macOS)
        run: brew install imagemagick

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5

      - name: Cache dependencies
        run: deno cache src/cli.ts src/setup.ts 2>/dev/null || true

      - name: Install Playwright Chromium
        run: npx -y playwright@latest install chromium

      - name: Check
        run: deno check src/ tests/

      - name: Lint
        run: deno lint

      - name: Test (Deno, macOS)
        run: deno test -A --no-check tests/

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install image dependencies (Windows)
        run: choco install imagemagick -y
        shell: pwsh

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5

      - name: Setup Chrome (for browser E2E tests)
        uses: browser-actions/setup-chrome@v1

      - name: Cache dependencies
        run: deno cache src/cli.ts src/setup.ts

      - name: Install Playwright Chromium
        run: npx -y playwright@latest install chromium

      - name: Check
        run: deno check src/ tests/

      - name: Lint
        run: deno lint

      - name: Test (Deno, Windows)
        run: deno test -A --no-check tests/

  test-linux-bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install image dependencies (Linux)
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (Bun)
        run: bun install

      # 暂不跑 Bun e2e，无需 Playwright
      # - name: Install Playwright Chromium
      #   run: npx -y playwright@latest install chromium

      # unit、integration、e2e 分开跑，避免 integration 结束时触发 cleanupSuiteBrowser 导致 "browser close timeout"
      - name: Test (Bun) unit
        run: bun test --max-concurrency=1 tests/unit
      - name: Test (Bun) integration
        run: bun test --max-concurrency=1 tests/integration
      # 暂不跑 Bun 浏览器 e2e（稳定性/耗时）；恢复时取消注释并恢复上面 Playwright 安装
      # e2e 按文件串行跑，每进程仅 2 个套件，减少 afterAll 超时 / dangling / browser close 互相干扰
      # - name: Test (Bun) e2e
      #   run: |
      #     failed=0
      #     for f in tests/e2e/*.test.ts; do
      #       bun test --max-concurrency=1 "$f" || failed=1
      #     done
      #     exit $failed

  test-macos-bun:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install image dependencies (macOS)
        run: brew install imagemagick

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (Bun)
        run: bun install

      # 暂不跑 Bun e2e，无需 Playwright
      # - name: Install Playwright Chromium
      #   run: npx -y playwright@latest install chromium

      # unit、integration、e2e 分开跑，避免 integration 结束时触发 cleanupSuiteBrowser 导致 "browser close timeout"
      - name: Test (Bun, macOS) unit
        run: bun test --max-concurrency=1 tests/unit
      - name: Test (Bun, macOS) integration
        run: bun test --max-concurrency=1 tests/integration
      # 暂不跑 Bun 浏览器 e2e（稳定性/耗时）；恢复时取消注释并恢复上面 Playwright 安装
      # e2e 按文件串行跑，每进程仅 2 个套件，减少 afterAll 超时 / dangling / browser close 互相干扰
      # - name: Test (Bun, macOS) e2e
      #   run: |
      #     failed=0
      #     for f in tests/e2e/*.test.ts; do
      #       bun test --max-concurrency=1 "$f" || failed=1
      #     done
      #     exit $failed

  test-windows-bun:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (Bun)
        run: bun install

      # 仅跑 unit不跑 integration 与 e2e
      - name: Test (Bun, Windows) unit
        run: bun test --max-concurrency=1 tests/unit
