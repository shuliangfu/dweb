# CI: 在 macOS、Ubuntu、Windows 上运行测试，验证跨平台兼容性
# 结构参考 view 包：Deno 与 Bun 拆成独立 job；Windows 上 Bun 不跑浏览器 e2e
name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install image dependencies (Linux)
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - uses: denoland/setup-deno@v1
        with:
          deno-version: v2.5

      - name: Cache dependencies
        run: deno cache src/cli.ts src/setup.ts 2>/dev/null || true

      - name: Install Playwright Chromium
        run: npx -y playwright@latest install chromium

      - name: Check
        run: deno check src/ tests/

      - name: Lint
        run: deno lint

      - name: Test (Deno)
        run: deno test -A --no-check tests/

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install image dependencies (macOS)
        run: brew install imagemagick

      - uses: denoland/setup-deno@v1
        with:
          deno-version: v2.5

      - name: Cache dependencies
        run: deno cache src/cli.ts src/setup.ts 2>/dev/null || true

      - name: Install Playwright Chromium
        run: npx -y playwright@latest install chromium

      - name: Check
        run: deno check src/ tests/

      - name: Lint
        run: deno lint

      - name: Test (Deno, macOS)
        run: deno test -A --no-check tests/

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install image dependencies (Windows)
        run: choco install imagemagick -y
        shell: pwsh

      - uses: denoland/setup-deno@v1
        with:
          deno-version: v2.5

      - name: Setup Chrome (for browser E2E tests)
        uses: browser-actions/setup-chrome@v1

      - name: Cache dependencies
        run: deno cache src/cli.ts src/setup.ts

      - name: Install Playwright Chromium
        run: npx -y playwright@latest install chromium

      - name: Check
        run: deno check src/ tests/

      - name: Lint
        run: deno lint

      - name: Test (Deno, Windows)
        run: deno test -A --no-check tests/

  test-linux-bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install image dependencies (Linux)
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (Bun)
        run: bun install

      - name: Install Playwright Chromium
        run: npx -y playwright@latest install chromium

      # unit、integration、e2e 分开跑，避免 integration 结束时触发 cleanupSuiteBrowser 导致 "browser close timeout"
      - name: Test (Bun) unit
        run: bun test --max-concurrency=1 tests/unit
      - name: Test (Bun) integration
        run: bun test --max-concurrency=1 tests/integration
      - name: Test (Bun) e2e
        run: bun test --max-concurrency=1 tests/e2e

  test-macos-bun:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install image dependencies (macOS)
        run: brew install imagemagick

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (Bun)
        run: bun install

      - name: Install Playwright Chromium
        run: npx -y playwright@latest install chromium

      # unit、integration、e2e 分开跑，避免 integration 结束时触发 cleanupSuiteBrowser 导致 "browser close timeout"
      - name: Test (Bun, macOS) unit
        run: bun test --max-concurrency=1 tests/unit
      - name: Test (Bun, macOS) integration
        run: bun test --max-concurrency=1 tests/integration
      - name: Test (Bun, macOS) e2e
        run: bun test --max-concurrency=1 tests/e2e

  # Windows 上不跑 Bun 测试：Bun 在 Windows 下 package.json 脚本子进程拿不到 --build，
  # 导致示例 build 会启动服务器而非构建；且存在 chromium.launch() 卡住等已知问题。
